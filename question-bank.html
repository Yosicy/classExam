<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassExam - Question Bank</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172554;margin:0}
header{background:#142b55;color:white;padding:20px}
main{max-width:800px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}
textarea{min-height:90px}
button{background:#142b55;color:white;padding:12px 20px;border:0;border-radius:7px;margin:5px 0}
#bank{display:none}
</style>
</head>
<body>
<header>
<h1>ClassExam</h1>
<p>Question Bank</p>
</header>
<main>
<section id="login" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Admin password">
<button id="loginButton">Login</button>
<p id="loginMessage"></p>
</section>

<section id="bank">
<div class="card">
<h2>Add a Question</h2>

<label>Grade</label>
<select id="grade">
<option>Grade 9</option><option>Grade 10</option>
<option>Grade 11</option><option>Grade 12</option>
<option>UEE</option>
</select>

<label>Subject</label>
<select id="subject">
<option>Mathematics</option><option>Biology</option>
<option>English</option><option>Physics</option>
<option>Chemistry</option><option>Aptitude</option>
</select>

<label>Question</label>
<textarea id="question" placeholder="Enter question"></textarea>

<label>Option A</label>
<input id="A" placeholder="Option A">

<label>Option B</label>
<input id="B" placeholder="Option B">

<label>Option C</label>
<input id="C" placeholder="Option C">

<label>Option D</label>
<input id="D" placeholder="Option D">

<label>Correct Answer</label>
<select id="answer">
<option value="">Choose answer</option>
<option value="A">A</option><option value="B">B</option>
<option value="C">C</option><option value="D">D</option>
</select>

<label>Explanation</label>
<textarea id="explanation" placeholder="Explain the correct answer"></textarea>

<button id="saveButton">Save Question</button>
<p id="status"></p>
</div>

<button id="logoutButton">Logout</button>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,collection,addDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Replace this object with your actual Firebase configuration.
const firebaseConfig = {
  apiKey: "AIzaSyAnlLd5OLIO0qDp1WrtvWQw5DNs8_tGCTI",
  authDomain: "classexam-57351.firebaseapp.com",
  projectId: "classexam-57351",
  storageBucket: "classexam-57351.firebasestorage.app",
  messagingSenderId: "688337040866",
  appId: "1:688337040866:web:f111d648d364a20dcbf5bb"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const login=document.getElementById("login");
const bank=document.getElementById("bank");
const status=document.getElementById("status");

document.getElementById("loginButton").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,
document.getElementById("email").value.trim(),
document.getElementById("password").value
);
document.getElementById("loginMessage").textContent="";
}catch(error){
document.getElementById("loginMessage").textContent="Login failed: "+error.message;
}
};

onAuthStateChanged(auth,user=>{
login.style.display=user?"none":"block";
bank.style.display=user?"block":"none";
});

document.getElementById("logoutButton").onclick=()=>signOut(auth);

document.getElementById("saveButton").onclick=async()=>{
const Question=document.getElementById("question").value.trim();
const OptionA=document.getElementById("A").value.trim();
const OptionB=document.getElementById("B").value.trim();
const OptionC=document.getElementById("C").value.trim();
const OptionD=document.getElementById("D").value.trim();
const correctAnswer=document.getElementById("answer").value;
const Explanation=document.getElementById("explanation").value.trim();

if(!Question||!OptionA||!OptionB||!OptionC||!OptionD||!correctAnswer){
status.textContent="Please complete the question and all four options, then choose the answer.";
return;
}

try{
await addDoc(collection(db,"questions"),{
Grade:document.getElementById("grade").value,
Subject:document.getElementById("subject").value,
Question,OptionA,OptionB,OptionC,OptionD,
correctAnswer,Explanation,
status:"draft",
createdBy:auth.currentUser.uid,
createdAt:serverTimestamp()
});
status.textContent="Question saved successfully!";
document.getElementById("question").value="";
document.getElementById("A").value="";
document.getElementById("B").value="";
document.getElementById("C").value="";
document.getElementById("D").value="";
document.getElementById("answer").value="";
document.getElementById("explanation").value="";
}catch(error){
status.textContent="Could not save: "+error.message;
}
};
</script>
</body>
                                                       </html>
