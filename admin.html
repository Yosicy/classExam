
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassExam Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172554;
    }
    header {
      background: #142b55;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
    }
    button {
      background: #142b55;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 7px;
      margin: 5px 0;
    }
    #dashboard { display: none; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>

<header>
  <h1>ClassExam</h1>
  <p>Administrator Dashboard</p>
</header>

<main>
  <section id="login" class="card">
    <h2>Administrator Login</h2>
    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button id="loginButton">Login</button>
    <p id="loginMessage"></p>
  </section>

  <section id="dashboard">
    <div class="card">
      <h2>Examination Management</h2>
      <h3>Create Examination</h3>

      <label>Subject</label>
      <select id="subject">
        <option>Mathematics</option>
        <option>Biology</option>
        <option>English</option>
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Aptitude</option>
      </select>

      <label>Examination duration (minutes)</label>
      <input type="number" id="duration" value="60" min="1">

      <label>Number of questions</label>
      <input type="number" id="questions" value="20" min="1">

      <button id="createButton">Create examination</button>
      <p id="message"></p>
    </div>

    <div class="card">
      <h3>Dashboard Features</h3>
      <p>Manage examinations</p>
      <p>Manage question banks</p>
      <p>Manage students</p>
      <p>View examination results</p>
      <p>Analyze student performance</p>
      <button id="logoutButton">Logout</button>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// INSERT YOUR ACTUAL FIREBASE CONFIGURATION VALUES HERE
const firebaseConfig = {
  apiKey: "AIzaSyAnlLd5OLIO0qDp1WrtvWQw5DNs8_tGCTI",
  authDomain: "classexam-57351.firebaseapp.com",
  projectId: "classexam-57351",
  storageBucket: "classexam-57351.firebasestorage.app",
  messagingSenderId: "688337040866",
  appId: "1:688337040866:web:f111d648d364a20dcbf5bb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");

document.getElementById("loginButton").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("loginMessage").textContent = "";
  } catch (error) {
    document.getElementById("loginMessage").textContent =
      "Login failed: " + error.message;
  }
};

onAuthStateChanged(auth, (user) => {
  loginSection.style.display = user ? "none" : "block";
  dashboard.style.display = user ? "block" : "none";
});

document.getElementById("logoutButton").onclick = async () => {
  await signOut(auth);
};

document.getElementById("createButton").onclick = async () => {
  const subject = document.getElementById("subject").value;
  const duration = Number(document.getElementById("duration").value);
  const questions = Number(document.getElementById("questions").value);
  const message = document.getElementById("message");

  if (!Number.isInteger(duration) || duration < 1 ||
      !Number.isInteger(questions) || questions < 1) {
    message.textContent = "Enter valid positive whole numbers.";
    return;
  }

  try {
    await addDoc(collection(db, "exams"), {
      subject,
      durationMinutes: duration,
      numberOfQuestions: questions,
      status: "draft",
      createdBy: auth.currentUser.uid,
      createdAt: serverTimestamp()
    });

    message.textContent = "Examination saved successfully!";
  } catch (error) {
    message.textContent = "Could not save: " + error.message;
  }
};
</script>

</body>
</html>
